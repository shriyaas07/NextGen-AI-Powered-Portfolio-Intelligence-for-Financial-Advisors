{% extends "base.html" %}
{% block title %}Sign Up — NextGen{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 bg-gray-50 dark:bg-slate-900">
  <div class="max-w-md w-full">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-8 border border-gray-100 dark:border-slate-700">
      <div class="text-center mb-8">
        <div class="w-16 h-16 gradient-bg rounded-2xl flex items-center justify-center mx-auto mb-4">
          <span class="text-white font-bold text-2xl">NG</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Create account</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Start building smarter portfolios today</p>
      </div>
      <form method="POST" action="/signup" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Full Name</label>
          <input type="text" name="name" required
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                 placeholder="Shriyaa Srivastav">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
          <input type="email" name="email" required
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                 placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
          <input type="password" name="password" required
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                 placeholder="Min 6 characters">
        </div>
        <div class="flex items-start gap-2">
          <input type="checkbox" required id="disclaimer-check"
                class="mt-1 accent-indigo-600 flex-shrink-0">
          <label for="disclaimer-check" class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">
            I understand that NextGen is a decision-support tool for financial professionals
            and does not constitute investment advice. Final investment decisions remain
            the responsibility of the licensed advisor.
          </label>
        </div>
        <button type="submit"
                class="w-full py-3 gradient-bg text-white font-bold rounded-xl hover:opacity-90 transition-opacity">
          Create Account →
        </button>
      </form>
      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
        Already have an account?
        <a href="/login" class="text-indigo-600 font-medium hover:underline">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
